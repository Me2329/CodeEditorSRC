# CodeCraft Studio - reference nsjail configuration.
#
# The runner builds its nsjail arguments programmatically so limits can vary per
# request; this file documents the same policy in nsjail's own config format and
# is useful for auditing or for running nsjail by hand:
#
#   nsjail --config scripts/profiles/nsjail-default.cfg -- /usr/bin/python3 -u main.py
#
# Paths and ceilings here are the defaults; the runner overrides them per job.

name: "codecraft-sandbox"
description: "Ephemeral, airgapped workspace for untrusted code execution."

mode: ONCE
hostname: "codecraft"
cwd: "/workspace"

time_limit: 10
max_cpus: 1

# Unprivileged inside the jail. 65534 is nobody on Debian and Ubuntu.
uidmap { inside_id: "65534" outside_id: "65534" count: 1 }
gidmap { inside_id: "65534" outside_id: "65534" count: 1 }

# Namespaces. Networking is cloned and left empty, which is the airgap.
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Resource ceilings. cgroup limits are the real memory ceiling; the rlimits are
# a second line of defence for hosts without a delegated cgroup tree.
cgroup_mem_max: 268435456      # 256 MiB
cgroup_pids_max: 64
rlimit_as_type: SOFT
rlimit_cpu: 5
rlimit_fsize: 32
rlimit_nofile: 512
rlimit_nproc: 64
rlimit_core: 0

# Filesystem: the toolchain read-only, the workspace writable, /tmp ephemeral.
mount { src: "/usr"  dst: "/usr"  is_bind: true rw: false }
mount { src: "/lib"  dst: "/lib"  is_bind: true rw: false mandatory: false }
mount { src: "/lib64" dst: "/lib64" is_bind: true rw: false mandatory: false }
mount { src: "/bin"  dst: "/bin"  is_bind: true rw: false mandatory: false }
mount { src: "/sbin" dst: "/sbin" is_bind: true rw: false mandatory: false }
mount { src: "/etc/alternatives" dst: "/etc/alternatives" is_bind: true rw: false mandatory: false }
mount { src: "/etc/ssl/certs" dst: "/etc/ssl/certs" is_bind: true rw: false mandatory: false }

mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size=67108864,mode=1777,nosuid,nodev" }
mount { dst: "/dev" fstype: "tmpfs" rw: true options: "size=4194304,mode=755" }

# The workspace is bind-mounted per job by the runner; this is the mount point.
mount { src: "/var/tmp/codecraft" dst: "/workspace" is_bind: true rw: true mandatory: false }

# /proc is hidden: it leaks host process information and offers writable paths.
mount_proc: false

# Scrubbed environment. The runner adds per-language variables on top.
envar: "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
envar: "HOME=/workspace"
envar: "TMPDIR=/workspace/tmp"
envar: "LANG=C.UTF-8"
envar: "CODECRAFT_SANDBOX=nsjail"

seccomp_policy_file: "scripts/profiles/seccomp-default.policy"
