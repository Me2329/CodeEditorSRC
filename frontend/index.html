    <meta name="color-scheme" content="dark" />

      name="description"
      content="CodeCraft Studio - a browser IDE that compiles and runs code in isolated, ephemeral sandboxes."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      No web-font CDN is referenced on purpose. CodeCraft Studio is built to run
      on airgapped and self-hosted networks, where a third-party font request
      simply hangs. The stylesheet uses Fira Code and Inter when the host has
      them and falls back to the platform's own UI and monospace faces.
    -->
