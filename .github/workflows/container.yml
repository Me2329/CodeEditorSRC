# Build the container, and run it.
#
# This exists because `docker compose up --build` was broken for 117 commits
# and nobody found out until someone tried to use it. Nothing in the test suite
# built the image, so nothing could have noticed: the Rust pin in the Dockerfile
# and the versions in the committed lockfiles drifted apart, and the failure
# surfaced inside a transitive crate nobody chose.
#
# Two jobs, fast one first. The pin check takes a second and catches exactly
# that drift, naming the crates responsible. The image build takes twenty
# minutes and catches everything else — including the things a static check
# cannot see, like a file the Dockerfile forgot to copy.

name: container

on:
  push:
    branches: ["**"]
  pull_request:
  # So a dependency that changes under a stationary repository is still caught.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-pin:
    name: the Rust pin matches the lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo is what makes the check exact: it reports every locked package's
      # edition and declared rust-version without compiling anything.
      - uses: dtolnay/rust-toolchain@stable

      - name: check
        run: python3 scripts/check_rust_pin.py

  image:
    name: the image builds and answers
    runs-on: ubuntu-latest
    # Not `needs: rust-pin`: when the pin is wrong it is useful to see the
    # build fail too, and the two together say more than either alone.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: codecraft:ci
          # Registry cache would be better and needs a registry; this keeps the
          # job self-contained at the cost of a cold first run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that produces an image nobody can start is only half a check.
      - name: run it
        run: |
          docker run -d --name codecraft \
            -p 8000:8000 \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --tmpfs /var/tmp/codecraft:size=256m,mode=1777 \
            codecraft:ci

      - name: wait for the gateway
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health > /tmp/health.json; then
              echo "up after ${attempt}s"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "the gateway never answered" >&2
          docker logs codecraft >&2
          exit 1

      - name: it serves the built frontend
        run: |
          # The image carries the bundle; if the frontend stage produced nothing
          # the gateway still starts and serves a page with no application in it.
          body=$(curl -fsS http://localhost:8000/)
          echo "$body" | grep -q 'CodeCraft' || {
            echo "the page came back without the application in it" >&2
            echo "$body" | head -40 >&2
            exit 1
          }

      - name: the runtimes it claims are the ones it has
        run: |
          curl -fsS http://localhost:8000/api/v1/runtimes \
            | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)
          installed = [r for r in runtimes if r.get('installed')]
          print(f'{len(installed)}/{len(runtimes)} runtimes installed')
          # The image installs Python, Node, gcc, g++, ruby, php, perl and a JRE,
          # so a single-digit count means a layer silently failed.
          assert len(installed) >= 8, 'too few runtimes: check the apt layer'
          "

      - name: logs, whatever happened
        if: always()
        run: docker logs codecraft 2>&1 | tail -50

      - name: stop
        if: always()
        run: docker rm -f codecraft || true

  compose:
    name: the compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap, and catches a typo in the file people are actually told to run.
      - run: docker compose config --quiet
